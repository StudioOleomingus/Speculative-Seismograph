<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speculative Seismograph — Speculations by Sem06 2026 Interaction Design Students</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0b0b0b;
            font-family: monospace;
        }
        #bg-frame {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: url('./BASE01.png') center center / cover no-repeat;
            z-index: 0;
            pointer-events: none;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        #toggle-panel {
            position: fixed;
            bottom: 60px;
            left: 51px;
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 10px;
            z-index: 10;
        }

        .toggle-switch {
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
        }

        .toggle-switch img {
            width: 69px;
            height: auto;
            display: block;
            transition: transform 0.1s ease;
        }

        .toggle-switch:active img {
            transform: scale(0.93);
        }

        .toggle-light img {
            width: 46px;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>

    <div id="bg-frame"></div>
    <div id="canvas-container"></div>

    <div id="toggle-panel">
        <div class="toggle-switch" data-index="0">
            <img src="./Assets/Switches/Off.png" alt="Story selector toggle switch 1">
        </div>
        <div class="toggle-light" data-index="0">
            <img src="./Assets/Lights/Off.png" alt="Indicator light for switch 1">
        </div>
        <div class="toggle-switch" data-index="1">
            <img src="./Assets/Switches/Off.png" alt="Story selector toggle switch 2">
        </div>
        <div class="toggle-light" data-index="1">
            <img src="./Assets/Lights/Off.png" alt="Indicator light for switch 2">
        </div>
        <div class="toggle-switch" data-index="2">
            <img src="./Assets/Switches/Off.png" alt="Story selector toggle switch 3">
        </div>
        <div class="toggle-light" data-index="2">
            <img src="./Assets/Lights/Off.png" alt="Indicator light for switch 3">
        </div>
        <div class="toggle-switch" data-index="3">
            <img src="./Assets/Switches/Off.png" alt="Story selector toggle switch 4">
        </div>
        <div class="toggle-light" data-index="3">
            <img src="./Assets/Lights/Off.png" alt="Indicator light for switch 4">
        </div>
        <div class="toggle-switch" data-index="4">
            <img src="./Assets/Switches/Off.png" alt="Story selector toggle switch 5">
        </div>
        <div class="toggle-light" data-index="4">
            <img src="./Assets/Lights/Off.png" alt="Indicator light for switch 5">
        </div>
    </div>

    <script type="module">
        import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';

        // --- 1. TOGGLE STATE ---
        const toggleState = [0, 0, 0, 0, 0];
        const switchEls = document.querySelectorAll('.toggle-switch');
        const lightEls = document.querySelectorAll('.toggle-light');

        function getFilename() {
            return './texts/' + toggleState.join('') + '.md';
        }

        function updateToggleImages() {
            switchEls.forEach(el => {
                const idx = parseInt(el.dataset.index);
                const isOn = toggleState[idx] === 1;
                el.querySelector('img').src = isOn
                    ? './Assets/Switches/On.png'
                    : './Assets/Switches/Off.png';
            });
            lightEls.forEach(el => {
                const idx = parseInt(el.dataset.index);
                const isOn = toggleState[idx] === 1;
                el.querySelector('img').src = isOn
                    ? './Assets/Lights/On.png'
                    : './Assets/Lights/Off.png';
            });
        }

        switchEls.forEach(el => {
            el.addEventListener('click', () => {
                const idx = parseInt(el.dataset.index);
                toggleState[idx] = toggleState[idx] ? 0 : 1;
                updateToggleImages();
                targetScroll = 0;
                currentScroll = 0;
                loadMarkdownFile(getFilename());
            });
        });

        // --- 2. THREE.JS SETUP ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(-0.06, -0.35, 7.0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setClearColor(0x000000, 0);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 1.0);
        scene.add(ambientLight);

        const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight1.position.set(5, 10, 7);
        scene.add(dirLight1);

        const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.4);
        dirLight2.position.set(-5, -5, 2);
        scene.add(dirLight2);

        // --- 3. TEXT CANVAS ---
        const textCanvas = document.createElement('canvas');
        const ctx = textCanvas.getContext('2d');

        const BASE_SIZE = 2048;
        const TEXT_HEIGHT = 2048;
        textCanvas.width = BASE_SIZE;
        textCanvas.height = TEXT_HEIGHT;

        const texture = new THREE.CanvasTexture(textCanvas);
        texture.minFilter = THREE.LinearFilter;
        texture.wrapS = THREE.ClampToEdgeWrapping;
        texture.wrapT = THREE.ClampToEdgeWrapping;

        const FONT_HEADER = 'bold 46px "Courier New", Courier, monospace';
        const FONT_BULLET = '38px "Courier New", Courier, monospace';
        const FONT_BODY = '28px "Courier New", Courier, monospace';
        const START_X = -850;
        const MAX_WIDTH = 1700;
        const INITIAL_Y = -650;
        const PADDING = 100;

        let frontOffset = 0;

        function measureWrapLines(context, text, maxWidth) {
            const words = text.split(' ');
            let line = '';
            let lineCount = 1;
            for (let n = 0; n < words.length; n++) {
                let testLine = line + words[n] + ' ';
                if (context.measureText(testLine).width > maxWidth && n > 0) {
                    line = words[n] + ' ';
                    lineCount++;
                } else {
                    line = testLine;
                }
            }
            return lineCount;
        }

        function measureTextExtent(mdText) {
            let y = INITIAL_Y;
            const lines = mdText.split('\n');
            lines.forEach((line) => {
                let trimmed = line.trim();
                if (!trimmed) { y += 20; return; }
                if (trimmed.startsWith('###')) {
                    ctx.font = FONT_HEADER; y += 64;
                } else if (trimmed.startsWith('•') || trimmed.startsWith('-')) {
                    ctx.font = FONT_BULLET; y += 56;
                } else {
                    ctx.font = FONT_BODY;
                    y += measureWrapLines(ctx, trimmed, MAX_WIDTH) * 38 + 28;
                }
            });
            return y;
        }

        function wrapText(context, text, x, y, maxWidth, lineHeight) {
            const words = text.split(' ');
            let line = '';
            let currentY = y;
            for (let n = 0; n < words.length; n++) {
                let testLine = line + words[n] + ' ';
                if (context.measureText(testLine).width > maxWidth && n > 0) {
                    context.fillText(line, x, currentY);
                    line = words[n] + ' ';
                    currentY += lineHeight;
                } else {
                    line = testLine;
                }
            }
            context.fillText(line, x, currentY);
            return currentY + lineHeight;
        }

        function parseAndDrawMD(mdText) {
            const finalY = measureTextExtent(mdText);
            const neededFromCenter = Math.max(Math.abs(INITIAL_Y), Math.abs(finalY)) + PADDING;
            const neededWidth = Math.max(BASE_SIZE, neededFromCenter * 2);

            textCanvas.width = neededWidth;
            textCanvas.height = TEXT_HEIGHT;

            // No paper — transparent so only text renders, no seam line visible
            ctx.clearRect(0, 0, textCanvas.width, textCanvas.height);
            ctx.fillStyle = '#222222';

            const lines = mdText.split('\n');

            ctx.save();
            ctx.translate(textCanvas.width / 2, textCanvas.height / 2);
            ctx.rotate(Math.PI / 2);

            let startY = INITIAL_Y;

            lines.forEach((line) => {
                let trimmed = line.trim();
                if (!trimmed) { startY += 20; return; }
                if (trimmed.startsWith('###')) {
                    ctx.font = FONT_HEADER;
                    ctx.fillText(trimmed, START_X, startY);
                    startY += 64;
                } else if (trimmed.startsWith('•') || trimmed.startsWith('-')) {
                    ctx.font = FONT_BULLET;
                    ctx.fillText(trimmed, START_X, startY);
                    startY += 56;
                } else {
                    ctx.font = FONT_BODY;
                    startY = wrapText(ctx, trimmed, START_X, startY, MAX_WIDTH, 38);
                    startY += 28;
                }
            });

            ctx.restore();

            // Update texture
            texture.dispose();
            texture.repeat.x = BASE_SIZE / textCanvas.width;

            // Text start is at texture U ≈ 0.5 + |INITIAL_Y|/w.
            // After UV shift, front face = mesh U=0.5, so:
            // final_U = 0.5 * repeat + offset = textStartU
            // offset = textStartU - 0.5 * repeat
            // Subtract 0.08 to push title into upper readable zone.
            const textStartU = 0.5 + Math.abs(INITIAL_Y) / textCanvas.width;
            const repeatX = BASE_SIZE / textCanvas.width;
            frontOffset = textStartU - 0.5 * repeatX - 0.08;
            texture.offset.x = frontOffset;
            texture.needsUpdate = true;
        }

        async function loadMarkdownFile(url) {
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error("File not found");
                const text = await response.text();
                parseAndDrawMD(text);
            } catch (err) {
                console.error("Error loading markdown:", err);
                const code = toggleState.join('');
                parseAndDrawMD("### " + code + "\n\nNo document found for\ncombination: " + code + "\n\nPlace a file at:\n./texts/" + code + ".md");
            }
        }

        loadMarkdownFile(getFilename());

        // --- 4. CYLINDER ---
        const radius = 1.7;
        // 512 segments, open-ended (no caps needed)
        const geometry = new THREE.CylinderGeometry(radius, radius, 6.0, 512, 1, true);

        // Shift all U coords by 0.5 so the UV seam (U=0/1 discontinuity)
        // moves from the front of the cylinder to the back, out of view.
        const uvAttr = geometry.attributes.uv;
        for (let i = 0; i < uvAttr.count; i++) {
            let u = uvAttr.getX(i);
            uvAttr.setX(i, (u + 0.5) % 1.0);
        }
        uvAttr.needsUpdate = true;

        const material = new THREE.MeshStandardMaterial({
            map: texture,
            roughness: 0.95,
            metalness: 0.0,
            color: 0xffffff,
            transparent: true,
            side: THREE.FrontSide
        });

        const cylinder = new THREE.Mesh(geometry, material);
        scene.add(cylinder);

        window.cylinder = cylinder;
        window.camera = camera;
        window.texture = texture;

        // Just horizontal — no Y rotation, no mirroring
        cylinder.rotation.z = Math.PI / 2;

        // --- 5. SCROLL VIA TEXTURE OFFSET ---
        let targetScroll = 0;
        let currentScroll = 0;
        const scrollSensitivity = 0.002;
        const ease = 0.08;
        const offsetScrollScale = 0.015;

        window.addEventListener('wheel', (event) => {
            targetScroll += event.deltaY * scrollSensitivity;
        });

        // --- 6. ANIMATION ---
        function animate() {
            requestAnimationFrame(animate);
            currentScroll += (targetScroll - currentScroll) * ease;
            // Title at front when currentScroll = 0.
            // Scroll down → offset decreases → later text comes into view.
            texture.offset.x = frontOffset - currentScroll * offsetScrollScale;
            renderer.render(scene, camera);
        }

        animate();

        // --- 7. RESIZE ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
