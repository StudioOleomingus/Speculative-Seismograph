# Cloudflare Worker config for the Speculative Seismograph view counter.
# Deploy with:  npx wrangler deploy   (from inside this backend/ folder)

name = "seismograph-views"
main = "worker.js"
compatibility_date = "2024-11-01"

# KV namespace holding the per-file, per-line counts.
# Create it once with:
#   npx wrangler kv namespace create VIEWS
# then paste the printed `id` below (replace REPLACE_WITH_KV_ID).
[[kv_namespaces]]
binding = "VIEWS"
id = "3df18a3d13ee4ca18fe11ecf40193659"
